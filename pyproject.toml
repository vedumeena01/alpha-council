[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-council"
version = "1.0.0"
description = "Institutional Multi-Agent Quantitative Trading System & Pre-Trade Risk Framework"
readme = "README.md"
authors = [
    { name = "Vedprakash Meena", email = "vedumeena01@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.6.0",
    "rich>=13.0.0",
]

[project.scripts]
alpha-council = "alphacouncil.run_council:run_interactive_pitch_demo"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
